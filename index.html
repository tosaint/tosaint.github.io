<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tosaint 余致賢</title>
<meta name="description" content="tosaint 余致賢: Master’s student in Architecture at NTUST, Taiwan. Portfolio, current research and Instagram.">
<meta property="og:title" content="tosaint 余致賢">
<meta property="og:description" content="An empty room fills with light, and blessings find their place to dwell.">
<meta property="og:image" content="https://tosaint.github.io/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Noto+Serif+TC:wght@300;400&display=swap">
<style>
:root {
  --ground: #101213; --ink: #e6e4de; --ink-2: #9a9d9b; --hair: #2b2f30; --brass: #c4a96a; --light: #e6e4de1f;
  --serif: "Bodoni Moda", "Didot", "Noto Serif TC", Georgia, serif;
  --sans: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --zh: "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --ground: #eceeed; --ink: #151819; --ink-2: #5b6162; --hair: #c8cdcc; --brass: #86692b; --light: #ffffffcc; color-scheme: light; }
}
:root[data-theme="light"] { --ground: #eceeed; --ink: #151819; --ink-2: #5b6162; --hair: #c8cdcc; --brass: #86692b; --light: #ffffffcc; color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.65 var(--sans); padding: max(48px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

/* the drawing sheet: one hairline frame with a title block along the bottom */
.sheet { position: relative; min-height: 100%; max-width: 1080px; margin: 0 auto; border: 1px solid var(--hair); display: grid; grid-template-rows: auto 1fr auto; }
.sheet::before, .sheet::after { content: ""; position: absolute; width: 11px; height: 11px; border-color: var(--ink-2); border-style: solid; pointer-events: none; }
.sheet::before { top: -6px; left: -6px; border-width: 1px 0 0 1px; }
.sheet::after { bottom: -6px; right: -6px; border-width: 0 1px 1px 0; }

.bar { display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(18px, 4vw, 40px); border-bottom: 1px solid var(--hair); font: 400 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.theme { font: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 1px solid var(--hair); color: var(--ink-2); border-radius: 0; padding: 3px 8px; cursor: pointer; }
.theme:hover { color: var(--ink); border-color: var(--ink-2); }

.field { position: relative; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: center; gap: clamp(24px, 5vw, 72px); padding: clamp(40px, 6vw, 88px) clamp(18px, 4vw, 40px); }
.text { display: grid; gap: 30px; min-width: 0; }
h1 { margin: 0; font: 400 clamp(52px, 9vw, 120px)/.95 var(--serif); letter-spacing: -.01em; }
h1 .zh { display: inline-block; font: 300 clamp(24px, 3.6vw, 44px)/1 var(--zh); letter-spacing: .2em; color: var(--ink-2); margin-left: .25em; }
.quote { margin: 0; display: grid; gap: 12px; max-width: 34em; }
.quote blockquote, .quote p { margin: 0; }
.quote blockquote p { font-size: clamp(18px, 1.9vw, 23px); line-height: 1.5; text-wrap: pretty; }
.quote figcaption { font: 400 14px/1.8 var(--zh); letter-spacing: .08em; color: var(--ink-2); }
.quote cite { font-style: normal; margin-left: .3em; white-space: nowrap; }

/* the entrance: a drawn dimension line that runs to the door */
.enter { display: flex; align-items: center; gap: 16px; max-width: 30em; padding-block: 6px; text-decoration: none; font: 400 13px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
.enter .line { flex: 1; height: 1px; background: var(--ink); position: relative; transform-origin: left; transition: transform .45s ease; transform: scaleX(.86); }
.enter .line::after { content: ""; position: absolute; right: -1px; top: -4px; width: 9px; height: 9px; border-top: 1px solid var(--ink); border-right: 1px solid var(--ink); transform: rotate(45deg); }
.enter:hover .line, .enter:focus-visible .line { transform: scaleX(1); }
@media (prefers-reduced-motion: reduce) { .enter .line { transition: none; } }

.water { position: absolute; top: -190px; right: -300px; width: 760px; height: auto; color: var(--ink-2); overflow: visible; pointer-events: none; }
.water circle { vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; opacity: 0;
  animation: drop var(--t) ease-in-out calc(var(--d) + var(--k) * .9s) infinite; }
@keyframes drop {
  0%   { opacity: 0; transform: scale(.82); }
  35%  { opacity: var(--o); transform: scale(.97); }
  60%  { opacity: calc(var(--o) * .75); transform: scale(1.03); }
  80%  { opacity: calc(var(--o) * .85); transform: scale(1.06); }
  100% { opacity: 0; transform: scale(1.14); }
}
@media (prefers-reduced-motion: reduce) { .water circle { animation: none; opacity: .22; } }

.block { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--hair); }
.cell { padding: 16px clamp(18px, 4vw, 40px) 18px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.cell + .cell { border-left: 1px solid var(--hair); }
.k { margin: 0; font: 400 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.v { margin: 0; font-size: 14.5px; }
.v a { text-underline-offset: 3px; text-decoration-color: var(--hair); }
.v a:hover { text-decoration-color: var(--ink); }
.v.mono { font: 400 12.5px/1.7 var(--mono); color: var(--ink-2); }
.ig { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 400 13px var(--mono); }
.ig svg { width: 22px; height: 22px; }
.ig:hover svg { color: var(--ink); }

@media (max-width: 820px) {
  body { padding: max(96px, env(safe-area-inset-top)) max(40px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(40px, env(safe-area-inset-left)); }
  .field { grid-template-columns: 1fr; padding-block: 96px 32px; }
  /* the ripples sit on the sheet's top-right corner and spill out of the frame */
  .water { position: absolute; top: -240px; right: -235px; width: 460px; max-width: none; margin: 0; }
  .text { position: relative; }
}
</style>
</head>
<body>
<div class="sheet">
  <header class="bar">
    <span>tosaint.github.io</span>
    <button class="theme" id="theme" type="button" aria-label="Switch colour theme">Light</button>
  </header>

  <main class="field">
    <div class="text">
      <h1>tosaint <span class="zh" lang="zh-Hant">余致賢</span></h1>
      <figure class="quote">
        <blockquote><p>An empty room fills with light, and blessings find their place to dwell.</p></blockquote>
        <figcaption lang="zh-Hant">— 瞻彼闋者，虛室生白，吉祥止止。<cite>《莊子・人間世》</cite></figcaption>
      </figure>
      <a class="enter" href="/portfolio/">Portfolio <span class="line" aria-hidden="true"></span></a>
    </div>

    <!-- 水聲木 (own work): each turned piece, in plan, drawn only as rings that rise and fade like ripples -->
    <svg class="water" viewBox="120 150 1140 1080" fill="none" stroke="currentColor" stroke-width=".5" role="img" aria-label="水聲木 in plan: rings that rise and fade where each turned wooden piece lies, like ripples on water">
      <g class="drop" style="--t:12.1s;--d:-9.0s;--o:0.3"><circle style="--k:0" cx="520" cy="620" r="110.2"/><circle style="--k:1" cx="520" cy="620" r="245"/></g>
      <g class="drop" style="--t:13.7s;--d:-10.1s;--o:0.31"><circle style="--k:0" cx="617" cy="990" r="118.0"/><circle style="--k:1" cx="617" cy="990" r="236"/></g>
      <g class="drop" style="--t:9.1s;--d:-4.2s;--o:0.31"><circle style="--k:0" cx="740" cy="395" r="84.0"/><circle style="--k:1" cx="740" cy="395" r="168"/></g>
      <g class="drop" style="--t:12.2s;--d:-11.0s;--o:0.21"><circle style="--k:0" cx="335" cy="440" r="138"/></g>
      <g class="drop" style="--t:11.3s;--d:-2.8s;--o:0.27"><circle style="--k:0" cx="1075" cy="420" r="100"/></g>
      <g class="drop" style="--t:11.9s;--d:-0.2s;--o:0.23"><circle style="--k:0" cx="825" cy="655" r="84"/></g>
      <g class="drop" style="--t:10.4s;--d:-9.5s;--o:0.29"><circle style="--k:0" cx="875" cy="1130" r="78"/></g>
      <g class="drop" style="--t:9.8s;--d:-7.8s;--o:0.22"><circle style="--k:0" cx="582" cy="290" r="60"/></g>
      <g class="drop" style="--t:12.1s;--d:-1.5s;--o:0.2"><circle style="--k:0" cx="1165" cy="585" r="64"/></g>
      <g class="drop" style="--t:13.4s;--d:-2.8s;--o:0.23"><circle style="--k:0" cx="528" cy="207" r="30"/></g>
    </svg>
  </main>

  <footer class="block">
    <div class="cell">
      <p class="k">Elsewhere</p>
      <a class="ig" href="https://www.instagram.com/tosaint" target="_blank" rel="noopener" aria-label="Instagram: @tosaint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
    <div class="cell">
      <p class="k">Sheet 00</p>
      <p class="v mono">Drawing: 水聲木, own work</p>
    </div>
  </footer>
</div>
<script>
(function () {
  var btn = document.getElementById("theme"), root = document.documentElement, saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  function current() { return root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
  function label() { btn.textContent = current() === "dark" ? "Light" : "Dark"; }
  label();
  btn.addEventListener("click", function () {
    root.dataset.theme = current() === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    label();
  });
})();
</script>
</body>
</html>
