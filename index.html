<style>
:root {
  --ground: #101213; --ink: #e6e4de; --ink-2: #9a9d9b; --hair: #2b2f30; --brass: #c4a96a; --light: #e6e4de1f;
  --serif: "Bodoni Moda", "Didot", "Noto Serif TC", Georgia, serif;
  --sans: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --zh: "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --ground: #eceeed; --ink: #151819; --ink-2: #5b6162; --hair: #c8cdcc; --brass: #86692b; --light: #ffffffcc; color-scheme: light; }
}
:root[data-theme="light"] { --ground: #eceeed; --ink: #151819; --ink-2: #5b6162; --hair: #c8cdcc; --brass: #86692b; --light: #ffffffcc; color-scheme: light; }

* { box-sizing: border-box; }
html, body { min-height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.65 var(--sans); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--ink-2); outline-offset: 4px; }

/* nothing but white space, a name, and the water */
.page { position: relative; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto;
  padding: max(28px, env(safe-area-inset-top)) max(clamp(28px, 7vw, 96px), env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(clamp(28px, 7vw, 96px), env(safe-area-inset-left)); }

.theme { justify-self: end; position: relative; z-index: 2; font: 400 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; background: none; border: 0; padding: 4px 0; color: var(--ink-2); cursor: pointer; opacity: .7; }
.theme:hover { opacity: 1; }

main { position: relative; z-index: 1; align-self: end; display: grid; gap: 28px; padding-bottom: clamp(48px, 10vh, 120px); }
h1 { margin: 0; font: 400 clamp(46px, 7.5vw, 104px)/.95 var(--serif); letter-spacing: -.01em; }
h1 .zh { display: inline-block; font: 300 clamp(20px, 2.8vw, 36px)/1 var(--zh); letter-spacing: .3em; color: var(--ink-2); margin-left: .35em; }

.enter { display: flex; align-items: center; gap: 16px; width: min(22em, 100%); padding-block: 6px; text-decoration: none; font: 400 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
.enter .line { flex: 1; height: 1px; background: currentColor; position: relative; transform-origin: left; transition: transform .6s ease; transform: scaleX(.8); opacity: .7; }
.enter .line::after { content: ""; position: absolute; right: -1px; top: -4px; width: 9px; height: 9px; border-top: 1px solid currentColor; border-right: 1px solid currentColor; transform: rotate(45deg); }
.enter:hover { color: var(--ink); }
.enter:hover .line, .enter:focus-visible .line { transform: scaleX(1); }
@media (prefers-reduced-motion: reduce) { .enter .line { transition: none; } }

.quiet { position: relative; z-index: 1; display: flex; align-items: center; gap: 28px; font: 400 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
.quiet a { text-decoration: none; opacity: .75; }
.quiet a:hover { opacity: 1; color: var(--ink); }
.ig { display: inline-flex; }
.ig svg { width: 18px; height: 18px; }

/* the ripples float free in the upper right, and are allowed to leave the screen */
.water { position: absolute; top: -6vh; right: -14vw; width: min(78vw, 1000px); height: auto; color: var(--ink-2); overflow: visible; pointer-events: none; z-index: 0; }
.water circle { vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; opacity: 0;
  animation: drop var(--t) ease-in-out calc(var(--d) + var(--k) * .9s) infinite; }
@keyframes drop {
  0%   { opacity: 0; transform: scale(.82); }
  35%  { opacity: var(--o); transform: scale(.97); }
  60%  { opacity: calc(var(--o) * .75); transform: scale(1.03); }
  80%  { opacity: calc(var(--o) * .85); transform: scale(1.06); }
  100% { opacity: 0; transform: scale(1.14); }
}
@media (prefers-reduced-motion: reduce) { .water circle { animation: none; opacity: .22; } }

/* the piece's name, set vertically beside the water */
.caption { position: absolute; z-index: 1; right: max(clamp(28px, 7vw, 96px), env(safe-area-inset-right)); top: 42vh; display: flex; flex-direction: column; gap: .7em; font: 400 14px/1 var(--zh); color: var(--ink-2); opacity: .6; margin: 0; }

@media (max-width: 720px) {
  .water { top: -4vh; right: -48vw; width: 135vw; }
  .caption { top: auto; bottom: 34vh; }
}
</style>
</head>
<body>
<div class="page">
  <button class="theme" id="theme" type="button" aria-label="Switch colour theme">Light</button>

  <!-- 水聲木 (own work): each turned piece, in plan, drawn only as rings that rise and fade like ripples -->
  <svg class="water" viewBox="120 150 1140 1080" fill="none" stroke="currentColor" stroke-width=".5" role="img" aria-label="水聲木 in plan: rings that rise and fade where each turned wooden piece lies, like ripples on water">
      <g class="drop" style="--t:12.1s;--d:-9.0s;--o:0.3"><circle style="--k:0" cx="520" cy="620" r="110.2"/><circle style="--k:1" cx="520" cy="620" r="245"/></g>
      <g class="drop" style="--t:13.7s;--d:-10.1s;--o:0.31"><circle style="--k:0" cx="617" cy="990" r="118.0"/><circle style="--k:1" cx="617" cy="990" r="236"/></g>
      <g class="drop" style="--t:9.1s;--d:-4.2s;--o:0.31"><circle style="--k:0" cx="740" cy="395" r="84.0"/><circle style="--k:1" cx="740" cy="395" r="168"/></g>
      <g class="drop" style="--t:12.2s;--d:-11.0s;--o:0.21"><circle style="--k:0" cx="335" cy="440" r="138"/></g>
      <g class="drop" style="--t:11.3s;--d:-2.8s;--o:0.27"><circle style="--k:0" cx="1075" cy="420" r="100"/></g>
      <g class="drop" style="--t:11.9s;--d:-0.2s;--o:0.23"><circle style="--k:0" cx="825" cy="655" r="84"/></g>
      <g class="drop" style="--t:10.4s;--d:-9.5s;--o:0.29"><circle style="--k:0" cx="875" cy="1130" r="78"/></g>
      <g class="drop" style="--t:9.8s;--d:-7.8s;--o:0.22"><circle style="--k:0" cx="582" cy="290" r="60"/></g>
      <g class="drop" style="--t:12.1s;--d:-1.5s;--o:0.2"><circle style="--k:0" cx="1165" cy="585" r="64"/></g>
      <g class="drop" style="--t:13.4s;--d:-2.8s;--o:0.23"><circle style="--k:0" cx="528" cy="207" r="30"/></g>
    </svg>
  <p class="caption" lang="zh-Hant" aria-label="水聲木"><span>水</span><span>聲</span><span>木</span></p>

  <main>
    <h1>tosaint <span class="zh" lang="zh-Hant">余致賢</span></h1>
    <a class="enter" href="/portfolio/">Portfolio <span class="line" aria-hidden="true"></span></a>
  </main>

  <footer class="quiet">
    <a class="ig" href="https://www.instagram.com/tosaint" target="_blank" rel="noopener" aria-label="Instagram: @tosaint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor" stroke="none"/></svg>
      </a>
    <a href="/portfolio/projects/seen-through/model/?study=1">Survey →</a>
  </footer>
</div>
<script>
(function () {
  var btn = document.getElementById("theme"), root = document.documentElement, saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  function current() { return root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
  function label() { btn.textContent = current() === "dark" ? "Light" : "Dark"; }
  label();
  btn.addEventListener("click", function () {
    root.dataset.theme = current() === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    label();
  });
})();
</script>
</body>
</html>
