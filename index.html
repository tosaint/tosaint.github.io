<style>
:root {
  --ground: #141412; --ink: #e8e5de; --ink-2: #8e8a82;
  --serif: "Noto Serif TC", "Songti TC", serif;
  --sans: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --edge: clamp(28px, 7vw, 96px); --foot: clamp(24px, 5vh, 48px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --ground: #f3f1ec; --ink: #2b2a27; --ink-2: #8b877e; color-scheme: light; }
}
:root[data-theme="light"] { --ground: #f3f1ec; --ink: #2b2a27; --ink-2: #8b877e; color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow: hidden; }
body { background: var(--ground); color: var(--ink); font: 400 11px/1.6 var(--sans); letter-spacing: .14em;
  min-height: 100vh; min-height: 100svh; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--ink-2); outline-offset: 5px; }

/* 間: the water in the middle, a seal of a name at the right, small words at the edges */
.water { position: fixed; left: 50%; top: 46%; width: min(62vw, 720px); height: auto; transform: translate(-50%, -50%);
  color: var(--ink-2); overflow: visible; pointer-events: none; }
.water circle, .tap circle { vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; }
.water circle { opacity: 0; animation: drop var(--t) cubic-bezier(.45,0,.55,1) calc(var(--d) + var(--k) * 1.6s) infinite; }
@keyframes drop {
  0%   { opacity: 0; transform: scale(.9); }
  40%  { opacity: var(--o); transform: scale(1); }
  70%  { opacity: calc(var(--o) * .8); transform: scale(1.04); }
  100% { opacity: 0; transform: scale(1.1); }
}

.seal { position: fixed; right: var(--edge); top: clamp(64px, 14vh, 140px); margin: 0; display: flex; gap: 14px; align-items: flex-start; font-weight: 400; }
.seal .zh { display: flex; flex-direction: column; gap: .55em; font: 300 clamp(19px, 1.7vw, 24px)/1 var(--serif); letter-spacing: 0; color: var(--ink); }
.seal .en { writing-mode: vertical-rl; font: 400 10px/1 var(--mono); letter-spacing: .3em; color: var(--ink-2); margin-top: 2px; }

.edge { position: fixed; text-transform: uppercase; color: var(--ink-2); }
.edge:hover { color: var(--ink); }
.theme { top: var(--foot); left: var(--edge); background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; cursor: pointer; }
.enter { bottom: var(--foot); left: var(--edge); }
.ig { bottom: var(--foot); right: var(--edge); display: inline-flex; }
.ig svg { width: 16px; height: 16px; }

/* touching the page drops a stone: a few rings open where the finger lands */
.tap { position: fixed; width: 240px; height: 240px; margin: -120px 0 0 -120px; overflow: visible; pointer-events: none; color: var(--ink-2); }
.tap circle { opacity: 0; animation: ring 3.6s cubic-bezier(.2,.6,.3,1) forwards; }
.tap circle:nth-child(2) { animation-delay: .45s; }
.tap circle:nth-child(3) { animation-delay: .9s; }
@keyframes ring { 0% { opacity: .55; transform: scale(.08); } 100% { opacity: 0; transform: scale(1); } }

@media (max-width: 720px) { .water { width: 118vw; top: 44%; } }
@media (prefers-reduced-motion: reduce) { .water circle { animation: none; opacity: .22; } }
</style>
</head>

<h1 class="seal" aria-label="tosaint 余致賢"><span class="en" aria-hidden="true">TOSAINT</span><span class="zh" lang="zh-Hant" aria-hidden="true"><span>余</span><span>致</span><span>賢</span></span></h1>

<button class="edge theme" id="theme" type="button" aria-label="Switch colour theme">Light</button>
<a class="edge enter" href="/portfolio/">Portfolio →</a>
<a class="edge ig" href="https://www.instagram.com/tosaint" target="_blank" rel="noopener" aria-label="Instagram: @tosaint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor" stroke="none"/></svg>
      </a>

<script>
(function () {
  var btn = document.getElementById("theme"), root = document.documentElement, saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  function current() { return root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
  function label() { btn.textContent = current() === "dark" ? "Light" : "Dark"; }
  label();
  btn.addEventListener("click", function () {
    root.dataset.theme = current() === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    label();
  });

  // a ripple where the page is touched; links and the button keep their own job
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var NS = "http://www.w3.org/2000/svg";
  document.addEventListener("pointerdown", function (e) {
    if (e.target.closest("a, button")) return;
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "tap"); svg.setAttribute("viewBox", "0 0 240 240");
    svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", ".6");
    svg.setAttribute("aria-hidden", "true");
    svg.style.left = e.clientX + "px"; svg.style.top = e.clientY + "px";
    for (var i = 0; i < 3; i++) {
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", 120); c.setAttribute("cy", 120); c.setAttribute("r", 118 - i * 26);
      svg.appendChild(c);
    }
    document.body.appendChild(svg);
    setTimeout(function () { svg.remove(); }, 5000);
  });
})();
</script>
