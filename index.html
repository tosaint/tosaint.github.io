<style>
:root {
  --ground: #101213; --ink: #e6e4de; --ink-2: #9a9d9b; --hair: #2b2f30; --brass: #c4a96a; --light: #e6e4de1f;
  --serif: "Bodoni Moda", "Didot", "Noto Serif TC", Georgia, serif;
  --sans: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --zh: "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --ground: #eceeed; --ink: #151819; --ink-2: #5b6162; --hair: #c8cdcc; --brass: #86692b; --light: #ffffffcc; color-scheme: light; }
}
:root[data-theme="light"] { --ground: #eceeed; --ink: #151819; --ink-2: #5b6162; --hair: #c8cdcc; --brass: #86692b; --light: #ffffffcc; color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.65 var(--sans); padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

/* the drawing sheet: one hairline frame with a title block along the bottom */
.sheet { position: relative; min-height: 100%; max-width: 1280px; margin: 0 auto; border: 1px solid var(--hair); display: grid; grid-template-rows: auto 1fr auto; }
.sheet::before, .sheet::after { content: ""; position: absolute; width: 11px; height: 11px; border-color: var(--ink-2); border-style: solid; pointer-events: none; }
.sheet::before { top: -6px; left: -6px; border-width: 1px 0 0 1px; }
.sheet::after { bottom: -6px; right: -6px; border-width: 0 1px 1px 0; }

.bar { display: flex; justify-content: space-between; align-items: center; padding: 14px clamp(18px, 4vw, 40px); border-bottom: 1px solid var(--hair); font: 400 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.theme { font: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 1px solid var(--hair); color: var(--ink-2); border-radius: 0; padding: 3px 8px; cursor: pointer; }
.theme:hover { color: var(--ink); border-color: var(--ink-2); }

.field { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: center; gap: clamp(24px, 5vw, 72px); padding: clamp(40px, 6vw, 88px) clamp(18px, 4vw, 40px); }
.text { display: grid; gap: 30px; min-width: 0; }
h1 { margin: 0; font: 400 clamp(52px, 9vw, 120px)/.95 var(--serif); letter-spacing: -.01em; }
h1 .zh { display: inline-block; font: 300 clamp(24px, 3.6vw, 44px)/1 var(--zh); letter-spacing: .2em; color: var(--ink-2); margin-left: .25em; }
.quote { margin: 0; display: grid; gap: 12px; max-width: 34em; }
.quote blockquote, .quote p { margin: 0; }
.quote blockquote p { font-size: clamp(18px, 1.9vw, 23px); line-height: 1.5; text-wrap: pretty; }
.quote figcaption { font: 400 14px/1.8 var(--zh); letter-spacing: .08em; color: var(--ink-2); }
.quote cite { font-style: normal; margin-left: .3em; white-space: nowrap; }

/* the entrance: a drawn dimension line that runs to the door */
.enter { display: flex; align-items: center; gap: 16px; max-width: 30em; padding-block: 6px; text-decoration: none; font: 400 13px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
.enter .line { flex: 1; height: 1px; background: var(--ink); position: relative; transform-origin: left; transition: transform .45s ease; transform: scaleX(.86); }
.enter .line::after { content: ""; position: absolute; right: -1px; top: -4px; width: 9px; height: 9px; border-top: 1px solid var(--ink); border-right: 1px solid var(--ink); transform: rotate(45deg); }
.enter:hover .line, .enter:focus-visible .line { transform: scaleX(1); }
@media (prefers-reduced-motion: reduce) { .enter .line { transition: none; } }

.water { width: 100%; max-width: 330px; height: auto; justify-self: center; color: var(--ink-2); overflow: visible; }
.water path, .water circle { vector-effect: non-scaling-stroke; }
.water .disc { fill: var(--ground); stroke-opacity: .8; }
.water .knob { fill: var(--ink-2); stroke: none; }
.water .sand { stroke-dasharray: 1 6; stroke-linecap: round; fill: none; opacity: .7; }
.water .ring { stroke-opacity: var(--hi); animation: breathe 6s ease-in-out var(--b) infinite alternate; }
.water .ripple { stroke: var(--ink); transform-box: fill-box; transform-origin: center; animation: ripple var(--t) cubic-bezier(.2,.6,.3,1) var(--d) infinite; opacity: 0; }
@keyframes breathe { from { stroke-opacity: var(--lo); } to { stroke-opacity: var(--hi); } }
@keyframes ripple { 0% { transform: scale(1); opacity: var(--o); } 75%, 100% { transform: scale(1.8); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .water .ripple { display: none; } .water .ring { animation: none; } }

.block { display: grid; grid-template-columns: 1.6fr 1fr 1fr; border-top: 1px solid var(--hair); }
.cell { padding: 16px clamp(18px, 4vw, 40px) 18px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.cell + .cell { border-left: 1px solid var(--hair); }
.k { margin: 0; font: 400 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.v { margin: 0; font-size: 14.5px; }
.v a { text-underline-offset: 3px; text-decoration-color: var(--hair); }
.v a:hover { text-decoration-color: var(--ink); }
.v.mono { font: 400 12.5px/1.7 var(--mono); color: var(--ink-2); }
.ig { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 400 13px var(--mono); }
.ig svg { width: 20px; height: 20px; }
.ig:hover span { text-decoration: underline; text-underline-offset: 3px; }

@media (max-width: 820px) {
  .field { grid-template-columns: 1fr; padding-block: 40px 32px; }
  .water { max-width: 190px; justify-self: start; order: -1; }
  .block { grid-template-columns: 1fr 1fr; }
  .cell.now { grid-column: 1 / -1; }
  .cell.now + .cell { border-left: 0; }
  .cell.now { border-bottom: 1px solid var(--hair); }
}
@media (max-width: 420px) {
  .block { grid-template-columns: 1fr; }
  .cell + .cell { border-left: 0; border-top: 1px solid var(--hair); }
  .cell.now { border-bottom: 0; }
}
</style>
</head>

<script>
(function () {
  var btn = document.getElementById("theme"), root = document.documentElement, saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  function current() { return root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
  function label() { btn.textContent = current() === "dark" ? "Light" : "Dark"; }
  label();
  btn.addEventListener("click", function () {
    root.dataset.theme = current() === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    label();
  });
})();
</script>
