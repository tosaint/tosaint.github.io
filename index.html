<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tosaint 余致賢</title>
<meta name="description" content="tosaint 余致賢: Master’s student in Architecture at NTUST, Taiwan. Portfolio, current research and Instagram.">
<meta property="og:title" content="tosaint 余致賢">
<meta property="og:description" content="Architecture, design and research by tosaint 余致賢.">
<meta property="og:image" content="https://tosaint.github.io/og.png">
<meta property="og:url" content="https://tosaint.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Noto+Serif+TC:wght@300;400&display=swap">
<style>
:root {
  --ground: #101213; --ink: #e6e4de; --ink-2: #9a9d9b; --hair: #2b2f30; --brass: #c4a96a; --light: #e6e4de1f;
  --serif: "Bodoni Moda", "Didot", "Noto Serif TC", Georgia, serif;
  --sans: "IBM Plex Sans", "Noto Sans TC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --zh: "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --ground: #eceeed; --ink: #151819; --ink-2: #5b6162; --hair: #c8cdcc; --brass: #86692b; --light: #ffffffcc; color-scheme: light; }
}
:root[data-theme="light"] { --ground: #eceeed; --ink: #151819; --ink-2: #5b6162; --hair: #c8cdcc; --brass: #86692b; --light: #ffffffcc; color-scheme: light; }

* { box-sizing: border-box; }
html, body { min-height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.65 var(--sans); }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--ink-2); outline-offset: 4px; }

/* nothing but white space, a name, and the water */
.page { position: relative; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto;
  padding: max(28px, env(safe-area-inset-top)) max(clamp(28px, 7vw, 96px), env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(clamp(28px, 7vw, 96px), env(safe-area-inset-left)); }

.theme { justify-self: end; position: relative; z-index: 2; font: 400 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; background: none; border: 0; padding: 4px 0; color: var(--ink-2); cursor: pointer; opacity: .7; }
.theme:hover { opacity: 1; }

main { position: relative; z-index: 1; align-self: end; display: grid; gap: 28px; padding-bottom: clamp(48px, 10vh, 120px); }
h1 { margin: 0; font: 400 clamp(46px, 7.5vw, 104px)/.95 var(--serif); letter-spacing: -.01em; color: var(--ink-2); opacity: .7; }
h1 .zh { display: inline-block; font: 300 clamp(20px, 2.8vw, 36px)/1 var(--zh); letter-spacing: .3em; margin-left: .35em; opacity: .8; }

/* 水聲木, resting on the water */
.leaf-title { position: absolute; z-index: 1; top: 47vh; right: 31vw; margin: 0; font: 300 15px/1 var(--zh); letter-spacing: .6em; color: var(--ink-2); opacity: .55; }

/* each character surfaces out of the mist and settles a few pixels, nothing more */
.f { display: inline-block; animation: settle var(--dur) cubic-bezier(.22,.61,.36,1) var(--del) both; }
.f > i { font-style: normal; }
@keyframes settle {
  0%   { opacity: 0; filter: blur(4px); transform: translateY(-14px); }
  60%  { filter: blur(0); }
  100% { opacity: 1; filter: blur(0); transform: none; }
}
@media (prefers-reduced-motion: reduce) { .f { animation: none; } }

.enter { display: flex; align-items: center; gap: 16px; width: min(22em, 100%); padding-block: 6px; text-decoration: none; font: 400 12px var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
.enter .line { flex: 1; height: 1px; background: currentColor; position: relative; transform-origin: left; transition: transform .6s ease; transform: scaleX(.8); opacity: .7; }
.enter .line::after { content: ""; position: absolute; right: -1px; top: -4px; width: 9px; height: 9px; border-top: 1px solid currentColor; border-right: 1px solid currentColor; transform: rotate(45deg); }
.enter:hover { color: var(--ink); }
.enter:hover .line, .enter:focus-visible .line { transform: scaleX(1); }
@media (prefers-reduced-motion: reduce) { .enter .line { transition: none; } }

.quiet { position: relative; z-index: 1; display: flex; align-items: center; gap: 28px; font: 400 11px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
.quiet a { text-decoration: none; opacity: .75; }
.quiet a:hover { opacity: 1; color: var(--ink); }
.ig { display: inline-flex; }
.ig svg { width: 18px; height: 18px; }

/* the ripples float free in the upper right, and are allowed to leave the screen */
.water { position: absolute; top: -6vh; right: -14vw; width: min(78vw, 1000px); height: auto; color: var(--ink-2); overflow: visible; pointer-events: none; z-index: 0; }
.water circle { vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; opacity: 0;
  animation: drop var(--t) cubic-bezier(.45,0,.55,1) calc(var(--d) + var(--k) * 1.6s) infinite; }
@keyframes drop {
  0%   { opacity: 0; transform: scale(.9); }
  40%  { opacity: var(--o); transform: scale(1); }
  70%  { opacity: calc(var(--o) * .8); transform: scale(1.04); }
  100% { opacity: 0; transform: scale(1.1); }
}
}
@media (prefers-reduced-motion: reduce) { .water circle { animation: none; opacity: .22; } }

@media (max-width: 720px) {
  .water { top: -4vh; right: -48vw; width: 135vw; }
  .leaf-title { top: 40vh; right: 14vw; font-size: 14px; }
}
</style>
</head>
<body>
<div class="page">
  <button class="theme" id="theme" type="button" aria-label="Switch colour theme">Light</button>

  <!-- 水聲木 (own work): each turned piece, in plan, drawn only as rings that rise and fade like ripples -->
  <svg class="water" viewBox="120 150 1140 1080" fill="none" stroke="currentColor" stroke-width=".5" role="img" aria-label="水聲木 in plan: rings that rise and fade where each turned wooden piece lies, like ripples on water">
      <g class="drop" style="--t:15.9s;--d:-8.7s;--o:0.3"><circle style="--k:0" cx="520" cy="620" r="110.2"/><circle style="--k:1" cx="520" cy="620" r="245"/></g>
      <g class="drop" style="--t:17.0s;--d:-10.3s;--o:0.31"><circle style="--k:0" cx="617" cy="990" r="118.0"/><circle style="--k:1" cx="617" cy="990" r="236"/></g>
      <g class="drop" style="--t:19.0s;--d:-1.2s;--o:0.31"><circle style="--k:0" cx="740" cy="395" r="84.0"/><circle style="--k:1" cx="740" cy="395" r="168"/></g>
      <g class="drop" style="--t:14.1s;--d:-11.8s;--o:0.21"><circle style="--k:0" cx="335" cy="440" r="138"/></g>
      <g class="drop" style="--t:16.1s;--d:-3.8s;--o:0.27"><circle style="--k:0" cx="1075" cy="420" r="100"/></g>
      <g class="drop" style="--t:22.0s;--d:-10.3s;--o:0.23"><circle style="--k:0" cx="825" cy="655" r="84"/></g>
      <g class="drop" style="--t:20.7s;--d:-9.9s;--o:0.29"><circle style="--k:0" cx="875" cy="1130" r="78"/></g>
      <g class="drop" style="--t:19.1s;--d:-2.9s;--o:0.22"><circle style="--k:0" cx="582" cy="290" r="60"/></g>
      <g class="drop" style="--t:19.1s;--d:-16.6s;--o:0.2"><circle style="--k:0" cx="1165" cy="585" r="64"/></g>
      <g class="drop" style="--t:18.2s;--d:-13.5s;--o:0.23"><circle style="--k:0" cx="528" cy="207" r="30"/></g>
    </svg>

  <p class="leaf-title" lang="zh-Hant" aria-label="水聲木" data-fall="0.2">水聲木</p>

  <main>
    <h1 aria-label="tosaint 余致賢"><span data-fall="1.4">tosaint</span> <span class="zh" lang="zh-Hant" data-fall="3.2">余致賢</span></h1>
    <a class="enter" href="/portfolio/">Portfolio <span class="line" aria-hidden="true"></span></a>
  </main>

  <footer class="quiet">
    <a class="ig" href="https://www.instagram.com/tosaint" target="_blank" rel="noopener" aria-label="Instagram: @tosaint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor" stroke="none"/></svg>
      </a>
  </footer>
</div>
<script>
// split each [data-fall] into characters that fall like leaves, each with its own sway, spin and timing
(function () {
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll("[data-fall]").forEach(function (el) {
    var start = parseFloat(el.dataset.fall) || 0, text = el.textContent;
    el.textContent = "";
    Array.from(text).forEach(function (ch, i) {
      var s = document.createElement("span"), inner = document.createElement("i");
      s.className = "f"; s.setAttribute("aria-hidden", "true");
      inner.textContent = ch; s.appendChild(inner);
      if (!reduce) {
        var r = function (a, b) { return a + Math.random() * (b - a); };
        s.style.setProperty("--del", (start + i * .28 + r(0, .2)).toFixed(2) + "s");
        s.style.setProperty("--dur", r(3.2, 4).toFixed(2) + "s");
      }
      el.appendChild(s);
    });
  });
})();
(function () {
  var btn = document.getElementById("theme"), root = document.documentElement, saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  function current() { return root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"); }
  function label() { btn.textContent = current() === "dark" ? "Light" : "Dark"; }
  label();
  btn.addEventListener("click", function () {
    root.dataset.theme = current() === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    label();
  });
})();
</script>
</body>
</html>
